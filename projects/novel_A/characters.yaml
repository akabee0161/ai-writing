田中誠:
  年齢: 28
  職業: 気象観測士
  性格: 理屈っぽいが根は優しい、都会育ちで合理主義者
  口調: 丁寧語と砕けた言葉が混在。考えながら話す癖があり「……」を多用する
  外見: 細身で眼鏡をかけている。いつも少し疲れた顔をしている

咲:
  年齢: 見た目16歳（実際は116歳）
  職業: 元・灯台守の娘（現在は幽霊）
  性格: 芯が強く、感情を抑えがち。しかし誠と接するうちに少しずつ表情が出てくる
  口調: 明治時代の言葉遣い。「～でございます」「～にございます」を使う
  外見: 薄い着物姿。髪を結い上げており、透き通るような青白い肌

源爺:
  年齢: 80代
  職業: 元漁師
  性格: 頑固だが情が深い。島の秘密を守ることに使命感を持つ
  口調: 荒々しい方言混じり。「～じゃ」「～わい」「そんなこと聞くな」など
  外見: 日焼けした皮膚に深い皺。大きな手をしている

山田:
  年齢: 45
  職業: 島の診療所医師
  性格: 表向きは温厚で親切。しかし何かを隠しており、時折不自然に話題を変える
  口調: 穏やかで知的。「そうですねえ」「まあ、それはともかく」が口癖
  外見: 白衣が似合う清潔感のある風貌。目が細い
